<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Merchandiser">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>EBM Merchandiser</title>
<style>
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --ink:#14213D; --mute:#5B667A; --line:#DDE2EA;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --ok:#0E7C5A; --ok-bg:#E3F4EC;
  --bad:#B3261E; --bad-bg:#FBE9E7; --warn:#8A5A00; --warn-bg:#FFF3D6;
  --disp:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1422; --card:#172036; --ink:#E8ECF4; --mute:#9AA6BC; --line:#27324B;
  --accent:#6E93FF; --accent-ink:#0E1422; --ok:#4FD1A0; --ok-bg:#12332A;
  --bad:#FF8A80; --bad-bg:#3A1C1A; --warn:#F2C35B; --warn-bg:#352A10; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:480px;margin:0 auto;padding-bottom:120px;min-height:100vh}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.01em}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px;border-bottom:1px solid var(--line)}
.top h1{font-size:21px;overflow-wrap:anywhere}
.sub{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1;min-width:0}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.out{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.idx{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--mono);background:var(--bg);border:1px solid var(--line);flex:none}
.out.done .idx{background:var(--ok);color:var(--accent-ink);border-color:var(--ok)}
.out.in .idx{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.name{font-weight:600;overflow-wrap:anywhere}
.code{font:500 12px var(--mono);color:var(--mute)}
.pill{font:600 12px system-ui,sans-serif;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.mute{background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.btn{font:600 15px system-ui,sans-serif;border:0;border-radius:10px;padding:13px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock>div{max-width:480px;margin:0 auto;display:flex;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.tab{font:600 12px system-ui,sans-serif;padding:9px 4px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer;text-align:center}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab small{display:block;font:600 11px var(--mono);margin-top:2px;opacity:.85}
.sec{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.tog{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.box{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700;color:var(--accent-ink)}
.tog.on .box{background:var(--ok);border-color:var(--ok)}
.tog.on .name{color:var(--mute);text-decoration:line-through}
.yn{display:flex;gap:6px}
.chip{font:600 13px system-ui,sans-serif;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.y.on{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.chip.n.on{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.gps{font:500 12px var(--mono);color:var(--mute);margin-top:6px;overflow-wrap:anywhere}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photos .ph{position:relative}
.photos img,.add{aspect-ratio:1;width:100%;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block}
.photos .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;cursor:pointer}
.add{display:grid;place-items:center;background:var(--bg);color:var(--accent);font:600 13px system-ui,sans-serif;cursor:pointer;text-align:center}
textarea,input[type=text],select{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;font:inherit}
textarea{min-height:90px}
.note{font-size:12px;color:var(--mute);margin-top:18px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sum .card b{display:block;font:700 28px var(--disp)}
.back{background:none;border:0;color:var(--accent);font:600 14px system-ui,sans-serif;padding:0 0 6px;cursor:pointer}
.rd{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rd:last-child{border:0}
.sync{font:600 12px system-ui,sans-serif;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer}
.sync.pend{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.sync.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;z-index:40;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div class="dock"><div id="dockin"></div></div>
<script src="config.js"></script>
<script>
"use strict";
var CFG = window.MERCH_CONFIG || {};
var CHECKS = ['POSM / danglers lage hain','Planogram ke mutabiq shelf','Price tag / price list sahi','Shelf saaf aur facing theek'];
var DB = null, ST = null, OUTLETS = [], view = {screen:'route', route:null, code:null, tab:0}, busy = false;

/* ---------- tiny IndexedDB key/value ---------- */
function idb(){ return new Promise(function(res,rej){
  if(DB) return res(DB);
  var r = indexedDB.open('merch',1);
  r.onupgradeneeded = function(){ var d=r.result; d.createObjectStore('kv'); d.createObjectStore('outbox',{autoIncrement:true}); };
  r.onsuccess = function(){ DB=r.result; res(DB); };
  r.onerror = function(){ rej(r.error); };
});}
function kvGet(k){ return idb().then(function(d){ return new Promise(function(res){ var q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=function(){res(q.result)}; q.onerror=function(){res(undefined)}; }); }); }
function kvSet(k,v){ return idb().then(function(d){ return new Promise(function(res){ var t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=function(){res()}; t.onerror=function(){res()}; }); }); }
function obAdd(v){ return idb().then(function(d){ return new Promise(function(res){ var t=d.transaction('outbox','readwrite'); t.objectStore('outbox').add(v); t.oncomplete=function(){res()}; }); }); }
function obAll(){ return idb().then(function(d){ return new Promise(function(res){ var out=[], q=d.transaction('outbox').objectStore('outbox').openCursor(); q.onsuccess=function(){ var c=q.result; if(c){out.push({k:c.key,v:c.value});c.continue()} else res(out) }; q.onerror=function(){res(out)}; }); }); }
function obDel(k){ return idb().then(function(d){ return new Promise(function(res){ var t=d.transaction('outbox','readwrite'); t.objectStore('outbox').delete(k); t.oncomplete=function(){res()}; }); }); }

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function fmt(t){ if(!t) return '–'; return new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove()},2600); }
function persist(){ return kvSet('state', ST); }
function vs(code){ if(!ST.v[code]) ST.v[code]={st:'pending',inT:null,outT:null,gps:null,fix:{},chk:{},note:'',b:[],a:[]}; return ST.v[code]; }
function cur(){ return OUTLETS.filter(function(o){return o.code===view.code})[0]; }
function stats(o){ var s=vs(o.code); var fixed=o.missing.filter(function(b){return s.fix[b]}).length;
  return {fixed:fixed,left:o.missing.length-fixed,ans:CHECKS.filter(function(c,i){return s.chk[i]}).length,nb:s.b.length,na:s.a.length}; }

/* ---------- outlets from Google Sheet ---------- */
function parseMissing(t){ return String(t||'').split(',').map(function(x){return x.trim()}).filter(function(x){return x && x.toLowerCase()!=='all purchased'}); }
function loadOutlets(){
  var cached = null;
  return kvGet('outlets').then(function(c){ cached=c; if(c && c.length){ OUTLETS=c; } })
  .then(function(){
    if(!CFG.API_URL) return;
    return fetch(CFG.API_URL+'?action=outlets&key='+encodeURIComponent(CFG.API_KEY||'')).then(function(r){return r.json()}).then(function(j){
      if(j && j.ok && j.outlets){ OUTLETS=j.outlets.map(function(o){ return {route:o.route,code:String(o.code),name:o.name,missing:parseMissing(o.missing),lat:o.lat,lng:o.lng}; }); return kvSet('outlets',OUTLETS); }
      throw new Error(j && j.error || 'bad response');
    }).catch(function(e){ ST.loadErr = 'Outlet list update nahi hui ('+e.message+'). Purani list chal rahi hai.'; });
  });
}

/* ---------- upload queue ---------- */
function pending(){ return obAll().then(function(a){return a.length}); }
function flush(){
  if(busy || !CFG.API_URL || !navigator.onLine) return Promise.resolve();
  busy=true;
  return obAll().then(function(items){
    var p=Promise.resolve(), sent=0;
    items.forEach(function(it){ p=p.then(function(){
      return fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:CFG.API_KEY||''},it.v))})
        .then(function(r){return r.json()}).then(function(j){ if(j&&j.ok){ sent++; return obDel(it.k); } throw new Error(j&&j.error||'server error'); });
    }); });
    return p.then(function(){ if(sent) toast(sent+' visit server par save ho gayi ✓'); }).catch(function(e){ toast('Upload baqi: '+e.message); });
  }).then(function(){ busy=false; refreshSync(); }, function(){ busy=false; });
}
function refreshSync(){ pending().then(function(n){ var el=$('#sync'); if(!el) return; el.className='sync '+(n?'pend':'ok'); el.textContent=n?('⟳ '+n+' upload baqi'):'✓ Sab sync'; }); }

/* ---------- photos: resize in browser so uploads stay small ---------- */
function shrink(file){ return new Promise(function(res,rej){
  var url=URL.createObjectURL(file), img=new Image();
  img.onload=function(){ var max=1000, w=img.width, h=img.height, k=Math.min(1,max/Math.max(w,h));
    var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.7)); };
  img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('photo padh nahi saka')); };
  img.src=url; }); }

/* ---------- GPS ---------- */
function getGPS(){ return new Promise(function(res){
  if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(function(p){ res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}); },
    function(){ res(null); }, {enableHighAccuracy:true,timeout:15000,maximumAge:0});
}); }
function dist(a,b,c,d){ var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2); return Math.round(2*R*Math.asin(Math.sqrt(h))); }

/* ---------- screens ---------- */
function syncBadge(){ return '<button class="sync" id="sync" data-act="sync">…</button>'; }
function routes(){ var m={}; OUTLETS.forEach(function(o){ m[o.route]=(m[o.route]||0)+1; }); return Object.keys(m).sort(function(a,b){return a.localeCompare(b)}).map(function(r){return {name:r,n:m[r]}}); }
function routeOutlets(r){ return OUTLETS.filter(function(o){return o.route===r}).sort(function(a,b){return a.name.localeCompare(b.name)}); }

function renderSetup(){
  $('#app').innerHTML='<div class="top"><h1>EBM Merchandiser</h1><div class="sub">Pehli baar apna naam likhein</div></div>'+
   '<div class="card" style="margin-top:14px"><label class="eyebrow" for="mname">Aap ka naam</label><div style="height:8px"></div><input id="mname" type="text" placeholder="e.g. Ali Raza" autocomplete="name"></div>'+
   (CFG.API_URL?'':'<p class="err">API_URL set nahi hai (config.js). App chalegi lekin data server par nahi jayega.</p>');
  $('#dockin').innerHTML='<button class="btn" data-act="savename">Shuru karein</button>';
}
function renderRoute(){
  var rs=routes();
  var h='<div class="top"><div class="row"><div class="sp"><div class="eyebrow">'+esc(ST.merch)+' · '+today()+'</div><h1>Route chunein</h1></div>'+syncBadge()+'</div></div>';
  if(ST.loadErr) h+='<p class="err">'+esc(ST.loadErr)+'</p>';
  if(!rs.length) h+='<div class="card" style="margin-top:14px"><b>Outlet list khali hai.</b><p class="sub">Internet on kar ke "Outlet list refresh" dabayein. Pehli baar internet zaroori hai.</p></div>';
  else{ h+='<div class="list">'; rs.forEach(function(r){
    var os=routeOutlets(r.name), d=os.filter(function(o){return vs(o.code).st==='done'}).length;
    h+='<button class="card out" data-route="'+esc(r.name)+'"><span class="sp"><span class="name">'+esc(r.name)+'</span><br><span class="code">'+r.n+' outlets</span></span><span class="pill '+(d===r.n?'ok':'mute')+'">'+d+'/'+r.n+'</span></button>'; }); h+='</div>'; }
  $('#app').innerHTML=h;
  $('#dockin').innerHTML='<button class="btn ghost" data-act="refresh">Outlet list refresh</button><button class="btn ghost" data-go="summary">Summary</button>';
  refreshSync();
}
function renderOutlets(){
  var os=routeOutlets(view.route), done=os.filter(function(o){return vs(o.code).st==='done'}).length, pct=os.length?Math.round(done/os.length*100):0;
  var h='<div class="top"><button class="back" data-go="route">← Routes</button><div class="row"><h1 class="sp">'+esc(view.route)+'</h1>'+syncBadge()+'</div><div class="row sub"><span class="sp">'+done+' / '+os.length+' outlet complete</span><span>'+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div><div class="list">';
  os.forEach(function(o,i){ var s=vs(o.code), cls=s.st==='done'?'done':(s.st==='in'?'in':'');
    var pill=s.st==='done'?'<span class="pill ok">Done '+fmt(s.outT)+'</span>':(s.st==='in'?'<span class="pill warn">Visit jari</span>':(o.missing.length?'<span class="pill bad">'+o.missing.length+' missing</span>':'<span class="pill ok">Sab hain</span>'));
    h+='<button class="card out '+cls+'" data-open="'+esc(o.code)+'"><span class="idx">'+(s.st==='done'?'✓':i+1)+'</span><span class="sp"><span class="name">'+esc(o.name)+'</span><br><span class="code">'+esc(o.code)+'</span></span>'+pill+'</button>'; });
  $('#app').innerHTML=h+'</div>';
  $('#dockin').innerHTML='<button class="btn ghost" data-go="summary">Din ka summary</button>';
  refreshSync();
}
function renderVisit(){
  var o=cur(), s=vs(o.code), st=stats(o);
  var h='<div class="top"><button class="back" data-go="outlets">← Outlets</button><div class="row"><h1 class="sp">'+esc(o.name)+'</h1>'+(s.st==='done'?'<span class="pill ok">Done</span>':s.st==='in'?'<span class="pill warn">Visit jari</span>':'<span class="pill mute">Shuru nai</span>')+'</div><div class="code">'+esc(o.code)+'</div></div>';
  if(s.st==='pending'){
    h+='<div class="card" style="margin-top:14px"><h3>Outlet par pohanch kar check-in karein</h3><p class="sub" style="margin:6px 0 0">Phone ka GPS aur waqt record hoga. Is outlet ke '+o.missing.length+' brands missing hain.</p><div id="gmsg" class="gps"></div></div>';
    $('#app').innerHTML=h; $('#dockin').innerHTML='<button class="btn" data-act="checkin" id="cbtn">Check-in (GPS)</button>'; return;
  }
  h+='<div class="card" style="margin-top:14px"><div class="row"><span class="sp"><b>Check-in '+fmt(s.inT)+'</b>'+(s.outT?' · Check-out '+fmt(s.outT):'')+'</span><span class="pill '+(s.gps?'ok':'warn')+'">'+(s.gps?'GPS ✓':'GPS nahi')+'</span></div><div class="gps">'+esc(s.gpsTxt||'')+'</div></div>';
  var T=['Brands','Checklist','Photos','Notes'], sm=[st.fixed+'/'+o.missing.length, st.ans+'/'+CHECKS.length, (st.nb+st.na)+'', s.note?'✓':'–'];
  h+='<div class="tabs">'+T.map(function(t,i){return '<button class="tab '+(view.tab===i?'on':'')+'" data-tab="'+i+'">'+t+'<small>'+sm[i]+'</small></button>'}).join('')+'</div><div class="sec">';
  if(view.tab===0){
    h+='<div class="sub">Jo brand aaj stock/display kar diya, us par tick karein.</div>';
    if(!o.missing.length) h+='<div class="card"><b>Is outlet ka koi brand missing nai.</b></div>';
    o.missing.forEach(function(b){ var on=s.fix[b];
      h+='<button class="card tog '+(on?'on':'')+'" data-fix="'+esc(b)+'"><span class="box">'+(on?'✓':'')+'</span><span class="sp name">'+esc(b)+'</span><span class="pill '+(on?'ok':'bad')+'">'+(on?'Rakh diya':'Missing')+'</span></button>'; });
  }
  if(view.tab===1){ CHECKS.forEach(function(c,i){ var v=s.chk[i];
    h+='<div class="card row"><span class="sp name">'+esc(c)+'</span><span class="yn"><button class="chip y '+(v==='y'?'on':'')+'" data-chk="'+i+':y">Haan</button><button class="chip n '+(v==='n'?'on':'')+'" data-chk="'+i+':n">Nahi</button></span></div>'; }); }
  if(view.tab===2){
    [['b','Pehle (before)'],['a','Baad (after)']].forEach(function(p){ var arr=s[p[0]];
      h+='<div class="card"><div class="row"><b class="sp">'+p[1]+'</b><span class="pill '+(arr.length?'ok':'mute')+'">'+arr.length+' photo</span></div><div class="photos">'+
        arr.map(function(u,i){return '<div class="ph"><img src="'+u+'" alt="photo"><button class="x" data-del="'+p[0]+':'+i+'" aria-label="photo hatayein">×</button></div>'}).join('')+
        '<label class="add" for="f-'+p[0]+'">+ Camera</label></div><input id="f-'+p[0]+'" data-photo="'+p[0]+'" type="file" accept="image/*" capture="environment" hidden></div>'; });
  }
  if(view.tab===3){ h+='<div class="card"><label for="note" class="eyebrow">Outlet ka note</label><div style="height:8px"></div><textarea id="note" placeholder="Retailer ne kya kaha, kya masla hai...">'+esc(s.note)+'</textarea></div>'; }
  $('#app').innerHTML=h+'</div>';
  if(s.st==='in'){ var ready=st.nb>0&&st.na>0; $('#dockin').innerHTML='<button class="btn ok" data-act="checkout">Check-out'+(ready?'':' (photo baqi)')+'</button>'; }
  else $('#dockin').innerHTML='<button class="btn ghost" data-go="outlets">Outlets par wapas</button>';
}
function renderSummary(){
  var tf=0,tm=0,vis=0,pc=0,tot=0,rows='';
  OUTLETS.forEach(function(o){ var s=ST.v[o.code]; if(!s||s.st==='pending') return; var st=stats(o); tot++; tm+=o.missing.length; tf+=st.fixed; pc+=st.nb+st.na; if(s.st==='done') vis++;
    rows+='<div class="rd"><span>'+esc(o.name)+'</span><span class="pill '+(s.st==='done'?(st.left?'warn':'ok'):'mute')+'">'+(s.st==='done'?(st.left?st.left+' baqi':'Complete'):'Jari')+'</span></div>'; });
  $('#app').innerHTML='<div class="top"><button class="back" data-go="route">← Routes</button><div class="row"><h1 class="sp">Din ka summary</h1>'+syncBadge()+'</div><div class="sub">'+esc(ST.merch)+' · '+today()+'</div></div>'+
   '<div class="sum"><div class="card"><span class="eyebrow">Outlets complete</span><b>'+vis+'</b></div><div class="card"><span class="eyebrow">Brands rakhe</span><b>'+tf+' / '+tm+'</b></div><div class="card"><span class="eyebrow">Photos</span><b>'+pc+'</b></div><div class="card"><span class="eyebrow">Baqi missing</span><b>'+(tm-tf)+'</b></div></div>'+
   '<div class="card" style="margin-top:14px">'+(rows||'<span class="sub">Aaj abhi koi visit nai hui.</span>')+'</div>';
  $('#dockin').innerHTML='<button class="btn ghost" data-act="rename">Naam badlein</button>';
  refreshSync();
}
function render(){ if(!ST.merch){renderSetup();return} ({route:renderRoute,outlets:renderOutlets,visit:renderVisit,summary:renderSummary})[view.screen](); }
function keepScroll(fn){ var y=window.scrollY; fn(); window.scrollTo(0,y); }

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-route],[data-open],[data-go],[data-act],[data-tab],[data-fix],[data-chk],[data-del]'); if(!t) return;
  var d=t.dataset, o, s;
  if(d.route){ view={screen:'outlets',route:d.route,code:null,tab:0}; render(); window.scrollTo(0,0); return; }
  if(d.open){ var x=OUTLETS.filter(function(q){return q.code===d.open})[0]; view={screen:'visit',route:x.route,code:x.code,tab:0}; render(); window.scrollTo(0,0); return; }
  if(d.go){ view.screen=d.go; render(); window.scrollTo(0,0); return; }
  if(d.tab){ view.tab=+d.tab; keepScroll(renderVisit); return; }
  if(d.fix){ s=vs(view.code); s.fix[d.fix]=!s.fix[d.fix]; persist(); keepScroll(renderVisit); return; }
  if(d.chk){ var p=d.chk.split(':'); s=vs(view.code); s.chk[p[0]]=(s.chk[p[0]]===p[1])?undefined:p[1]; persist(); keepScroll(renderVisit); return; }
  if(d.del){ var q=d.del.split(':'); s=vs(view.code); s[q[0]].splice(+q[1],1); persist(); keepScroll(renderVisit); return; }
  var a=d.act;
  if(a==='savename'){ var v=($('#mname').value||'').trim(); if(!v){ toast('Naam likhein'); return; } ST.merch=v; persist(); render(); }
  if(a==='rename'){ ST.merch=''; persist(); render(); }
  if(a==='sync'){ flush(); toast('Sync shuru…'); }
  if(a==='refresh'){ toast('Outlet list la raha hun…'); loadOutlets().then(function(){ render(); }); }
  if(a==='checkin'){
    o=cur(); s=vs(o.code); var b=$('#cbtn'); b.disabled=true; b.textContent='GPS dhoond raha hun…';
    getGPS().then(function(g){
      s.st='in'; s.inT=Date.now(); s.gps=g;
      if(g){ s.gpsTxt='GPS '+g.lat+', '+g.lng+' (±'+g.acc+' m)'+((o.lat&&o.lng)?' · outlet se '+dist(g.lat,g.lng,+o.lat,+o.lng)+' m door':''); }
      else s.gpsTxt='GPS nahi mila. Phone ki location on karein aur browser ko permission dein.';
      view.tab=0; persist(); renderVisit(); window.scrollTo(0,0); if(!g) toast('GPS nahi mila');
    });
  }
  if(a==='checkout'){
    o=cur(); s=vs(o.code); var st=stats(o);
    s.st='done'; s.outT=Date.now(); persist();
    var rec={id:ST.merch+'|'+today()+'|'+o.code, merch:ST.merch, date:today(), route:o.route, code:o.code, name:o.name, inT:s.inT, outT:s.outT, gps:s.gps,
      missing:o.missing, fixed:o.missing.filter(function(b){return s.fix[b]}), left:o.missing.filter(function(b){return !s.fix[b]}),
      checks:CHECKS.map(function(c,i){return {q:c,a:s.chk[i]||''}}), note:s.note, before:s.b, after:s.a};
    obAdd(rec).then(function(){ view.screen='outlets'; render(); window.scrollTo(0,0); return flush(); });
  }
});
document.addEventListener('change',function(e){
  var f=e.target.closest('[data-photo]'); if(!f||!f.files||!f.files[0]) return;
  var k=f.dataset.photo, s=vs(view.code), file=f.files[0]; toast('Photo save ho rahi hai…');
  shrink(file).then(function(u){ s[k].push(u); return persist(); }).then(function(){ keepScroll(renderVisit); }).catch(function(er){ toast(er.message); });
});
document.addEventListener('input',function(e){ if(e.target.id==='note'){ vs(view.code).note=e.target.value; persist(); } });
window.addEventListener('online',function(){ flush(); });

/* ---------- boot ---------- */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
kvGet('state').then(function(s){
  ST=s||{merch:'',v:{},day:today()};
  if(ST.day!==today()){ ST.v={}; ST.day=today(); }
  return loadOutlets();
}).then(function(){ return persist(); }).then(function(){ render(); flush(); });
</script>
</body>
</html>
